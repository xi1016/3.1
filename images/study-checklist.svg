<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="A clipboard checklist with three completed ticks and one pending item">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8f6f2"/>
      <stop offset="1" stop-color="#d3ece4"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg2)"/>
  <circle cx="680" cy="120" r="60" fill="#b9e2d4" opacity="0.6"/>
  <circle cx="110" cy="500" r="46" fill="#b9e2d4" opacity="0.5"/>

  <!-- clipboard -->
  <g>
    <rect x="250" y="90" width="300" height="430" rx="22" fill="#ffffff" stroke="#cfe0d8" stroke-width="4"/>
    <rect x="340" y="70" width="120" height="44" rx="14" fill="#5d6b7d"/>
    <rect x="356" y="82" width="88" height="20" rx="8" fill="#8b98a9"/>

    <!-- item 1: done -->
    <rect x="286" y="150" width="228" height="62" rx="12" fill="#eef7f3"/>
    <rect x="300" y="166" width="30" height="30" rx="8" fill="#0d9d8e"/>
    <path d="M306 181l7 7 13-14" stroke="#fff" stroke-width="4.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M348 172h120M348 190h84" stroke="#b8cbc2" stroke-width="6" stroke-linecap="round"/>

    <!-- item 2: done -->
    <rect x="286" y="230" width="228" height="62" rx="12" fill="#eef7f3"/>
    <rect x="300" y="246" width="30" height="30" rx="8" fill="#0d9d8e"/>
    <path d="M306 261l7 7 13-14" stroke="#fff" stroke-width="4.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M348 252h130M348 270h70" stroke="#b8cbc2" stroke-width="6" stroke-linecap="round"/>

    <!-- item 3: done -->
    <rect x="286" y="310" width="228" height="62" rx="12" fill="#eef7f3"/>
    <rect x="300" y="326" width="30" height="30" rx="8" fill="#0d9d8e"/>
    <path d="M306 341l7 7 13-14" stroke="#fff" stroke-width="4.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M348 332h110M348 350h90" stroke="#b8cbc2" stroke-width="6" stroke-linecap="round"/>

    <!-- item 4: pending -->
    <rect x="286" y="390" width="228" height="62" rx="12" fill="#fdf6ec"/>
    <rect x="300" y="406" width="30" height="30" rx="8" fill="none" stroke="#e0b36a" stroke-width="4"/>
    <path d="M348 412h120M348 430h64" stroke="#d9c5a5" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- pencil -->
  <g transform="rotate(28 640 420)">
    <rect x="620" y="330" width="26" height="170" rx="4" fill="#f4b860"/>
    <path d="M620 500l13 30 13-30z" fill="#e8d3b0"/>
    <path d="M626 512l7 16 7-16z" fill="#5d6b7d"/>
    <rect x="620" y="316" width="26" height="18" rx="4" fill="#e8837b"/>
  </g>
</svg>
