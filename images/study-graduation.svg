<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="A stack of books topped with a graduation cap">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f0ecfa"/>
      <stop offset="1" stop-color="#e0d8f3"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg3)"/>
  <circle cx="140" cy="120" r="52" fill="#cfc2ec" opacity="0.6"/>
  <circle cx="690" cy="480" r="60" fill="#cfc2ec" opacity="0.5"/>

  <!-- books, bottom to top -->
  <g>
    <rect x="240" y="470" width="320" height="44" rx="8" fill="#7a6cc9"/>
    <rect x="252" y="482" width="12" height="20" rx="4" fill="#ffffff" opacity="0.35"/>
    <rect x="262" y="420" width="300" height="44" rx="8" fill="#f0a5a5"/>
    <rect x="274" y="432" width="12" height="20" rx="4" fill="#ffffff" opacity="0.45"/>
