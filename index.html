<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>StudyFlow — My Study Task Manager</title>
  <meta name="description" content="Entry point for StudyFlow, a study task management web application. The application pages live in the html/ folder." />
  <meta http-equiv="refresh" content="0; url=html/index.html" />
  <link rel="icon" href="images/favicon.svg" type="image/svg+xml" />
  <style>
    :root {
      --bg: #f4f7fb;
      --surface: #ffffff;
      --border: #dbe4ef;
      --text: #16222f;
      --muted: #5b6b7e;
      --accent: #2f7ff0;
      --accent-dark: #1f63c9;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 2rem 1.25rem;
      background:
        radial-gradient(40rem 26rem at 80% -10%, #e5effe, transparent 60%),
        radial-gradient(32rem 22rem at 0% 10%, #e0f5f2, transparent 55%),
        var(--bg);
      color: var(--text);
      font-family: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
      line-height: 1.6;
    }

    main {
      width: 100%;
      max-width: 30rem;
      padding: 2.25rem 2rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      box-shadow: 0 18px 44px rgba(23, 44, 74, 0.1);
      text-align: center;
    }

    .logo {
      width: 3rem;
      height: 3rem;
      margin: 0 auto 1rem;
      display: grid;
      place-items: center;
      border-radius: 14px;
      background: var(--accent);
      color: #fff;
      font-weight: 700;
      font-size: 1.35rem;
      letter-spacing: -0.02em;
    }

    h1 {
      margin: 0 0 0.4rem;
      font-size: 1.5rem;
      letter-spacing: -0.02em;
    }

    p {
      margin: 0 0 1.35rem;
      color: var(--muted);
      font-size: 0.95rem;
    }

    a {
      display: inline-block;
      padding: 0.7rem 1.35rem;
      border-radius: 999px;
      background: var(--accent);
      color: #fff;
      font-weight: 600;
      font-size: 0.95rem;
      text-decoration: none;
      transition: background 0.18s ease;
    }

    a:hover,
    a:focus-visible { background: var(--accent-dark); }

    code {
      font-family: "Cascadia Code", Consolas, monospace;
      font-size: 0.86em;
      padding: 0.1rem 0.35rem;
      border-radius: 5px;
      background: #f0f4fa;
      color: var(--text);
    }

    .note {
      margin-top: 1.4rem;
      padding-top: 1.1rem;
      border-top: 1px solid var(--border);
      font-size: 0.82rem;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <main>
    <div class="logo" aria-hidden="true">SF</div>
    <h1>StudyFlow</h1>
    <p>My Study Task Manager — loading the home page…</p>
    <a href="html/index.html">Open StudyFlow</a>
    <p class="note">
      This is only the repository entry point. All application pages live in the
      <code>html/</code> folder (<code>index.html</code>, <code>tasks.html</code>,
      <code>blog.html</code>, <code>ethics.html</code>), with styles in <code>css/</code>
      and scripts in <code>js/</code>.
    </p>
  </main>
</body>
</html>
